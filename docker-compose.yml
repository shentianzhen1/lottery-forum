services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lottery
      POSTGRES_PASSWORD: lottery
      POSTGRES_DB: lottery_forum
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lottery -d lottery_forum"]
      interval: 5s
      timeout: 5s
      retries: 10
