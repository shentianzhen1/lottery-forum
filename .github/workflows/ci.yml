name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install API dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt
      - name: Test API boundaries
        working-directory: apps/api
        run: python -m pytest tests

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true
      - name: Analyze and test landscape shell
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Test configurable API address
        working-directory: apps/mobile
        run: >-
          flutter test test/api_config_test.dart
          --dart-define=API_BASE_URL=http://127.0.0.1:8000
          --dart-define=EXPECTED_API_BASE_URL=http://127.0.0.1:8000
      - name: Render UI previews
        working-directory: apps/mobile
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          flutter test test/premium_layout_test.dart --dart-define=EXPORT_UI_PREVIEW=true
      - uses: actions/upload-artifact@v4
        with:
          name: ui-preview-${{ github.run_id }}
          path: apps/mobile/build/ui-preview/*.png
          if-no-files-found: error
          retention-days: 7
